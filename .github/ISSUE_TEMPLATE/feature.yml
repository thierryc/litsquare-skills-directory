name: Feature request
description: Suggest an outcome or improvement for LitSquare Skills.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What work is difficult today?
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
    validations: { required: true }
