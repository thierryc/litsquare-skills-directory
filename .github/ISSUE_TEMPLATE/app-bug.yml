name: App bug report
description: Report a reproducible LitSquare Skills app problem without sharing secrets or private content.
title: "[App bug]: "
labels: [bug, app]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LitSquare Skills. Security issues belong in a private advisory.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior in plain language.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App and macOS version
      placeholder: LitSquare Skills 0.1.0 (1), macOS 26.6
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs, tokens, home paths, and confidential Skill content.
          required: true
