name: Link check

on:
  pull_request:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress --exclude-path node_modules --exclude-path dist './**/*.md' './site/src/**/*.astro'
          fail: true
