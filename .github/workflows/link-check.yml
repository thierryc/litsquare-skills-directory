name: Link check

on:
  pull_request:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --verbose --no-progress --exclude-path node_modules --exclude-path dist './**/*.md' './site/src/**/*.astro'
          fail: true
